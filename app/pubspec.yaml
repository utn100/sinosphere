name: sinosphere_rosetta
description: "Sinosphere — Hán-Việt Dictionary for Vietnamese learners of Chinese"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # SQLite / Drift
  drift: ^2.23.1
  drift_sqflite: ^2.0.1
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1

  # State management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # Networking (AI service)
  http: ^1.2.2

  # Secure API key storage
  flutter_secure_storage: ^11.0.0

  # URL launcher (Google lookup)
  url_launcher: ^6.3.1

  # Loading skeleton
  shimmer: ^3.0.0

  # Image picker + on-device OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0

  # Icons
  cupertino_icons: ^1.0.8
  uuid: ^4.6.0
  shared_preferences: ^2.3.3

  # Fonts
  google_fonts: ^6.2.1

  # Notifications
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.23.1
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.8
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0D1117"
  color_dark: "#0D1117"
  image: assets/icon.png
  android: true
  ios: true
  android_gravity: center
  fullscreen: false

flutter:
  uses-material-design: true

  assets:
    - assets/sinosphere.db
